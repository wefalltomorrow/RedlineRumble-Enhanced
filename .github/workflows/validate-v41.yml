name: Validate v41 property isolation
on:
  push:
    branches: [experiment/v41-no-shaderlist]
  pull_request:
  workflow_dispatch:
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q source experiments
      - name: Test v41 property access
        run: python experiments/test_rr_v41.py
