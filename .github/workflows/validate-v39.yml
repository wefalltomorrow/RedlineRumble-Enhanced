name: Validate v39 ghost cap

on:
  push:
    branches: [experiment/v39-hardcap-no-delete]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q experiments source
      - name: Ghost cap source tests
        run: python experiments/test_rr_v39.py
