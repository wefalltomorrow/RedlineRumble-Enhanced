name: v38 ghost lifecycle checks

on:
  push:
    branches: [experiment/v38-bounded-rear-traffic]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q experiments source
      - name: Test clone deletion and name reuse bytecode
        run: python experiments/test_rr_v38.py
